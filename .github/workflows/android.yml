name: Android Build
on:
  push:
    branches: [main]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.11.1
      - name: Validate embedded JavaScript
        run: python3 -c 'import re,pathlib; s=pathlib.Path("app/src/main/assets/index.html").read_text(); js=re.findall(r"<script>(.*?)</script>",s,re.S); pathlib.Path("/tmp/luma.js").write_text(js[-1]); assert js' && node --check /tmp/luma.js
      - name: Build debug APK
        run: gradle --no-daemon assembleDebug
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Luma-debug
          path: app/build/outputs/apk/debug/app-debug.apk